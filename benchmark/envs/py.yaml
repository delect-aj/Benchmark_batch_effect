name: bench-py
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy=1.26.4   # DEBIAS-M requires numpy<=1.26.4
  - pandas
  - scikit-learn
  - pip
  - pip:
      - torch
      - pytorch-lightning
      - lightning-bolts
      - scvi-tools
      - anndata
# DEBIAS-M is GitHub-only; install from a local clone:  pip install --no-deps <src>/DEBIAS-M
