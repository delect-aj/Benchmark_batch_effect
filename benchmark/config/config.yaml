# Workflow config. Override on the command line, e.g. --config reps=1 only=sweep_16s
rscript: ~/software/miniconda3/envs/bench-r/bin/Rscript
python: ~/software/miniconda3/envs/bench-py/bin/python
rscript_data: ~/software/miniconda3/envs/bench-data/bin/Rscript   # curatedMetagenomicData only
scenarios: config/scenarios.tsv   # frozen design (simulate/design.R); do not regenerate after results exist
only: ""                          # regex filter on scenario ids ("" = all)
reps: 20
timeout: 6h                       # a method hitting this is recorded as failed, not dropped
templates:
  16s: data/templates/16s.tsv
  mgx: data/templates/mgx.tsv
real: [crc_mgx, ibd_mgx, ici_mgx, crc_16s, ibd_16s, hiv_16s, seed_16s]
microbiomehd_repo: ~/software/src/microbiomeHD   # authors' repo: per-study label config (cloned on the login node)
methods: [raw, oracle, limma, combat, combatseq, mmuphin, conqur, cqr, plsdabatch, wplsdabatch,
          percentile, metadict, debias_m, harmony, fastmnn, scanvi]
# ruviiinb: unavailable with current Bioconductor (see README); wrapper kept
# Sensitivity variants, only on scenarios matching sensitivity_only (PLAN.md, pre-run check A1)
sensitivity_methods: [conqur_default, conqur_permcov]
sensitivity_only: "^(sweep|null)_"
threads: {conqur: 2, conqur_default: 2, conqur_permcov: 2, cqr: 2, debias_m: 4, scanvi: 4}
